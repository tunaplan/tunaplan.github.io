<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f2f3f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>n.n.</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="n.n.">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@200;300&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
  :root{ --paper:#f2f3f1; --ink:#44474c; --faint:#a2a7ac; }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{height:100%;overflow:hidden;background:var(--paper);
    font-family:"Noto Serif KR",serif;font-weight:200;color:var(--ink)}

  /* 안쪽 (종이 너머) */
  #app{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;background:var(--paper);
    opacity:0;transition:opacity 1.6s ease 1s}
  body.opened #app{opacity:1}
  #app h1{font-weight:200;font-size:17px;letter-spacing:.3em;padding-left:.3em;text-align:center;margin:9vh 0 7vh}
  #app .by{position:fixed;right:7vw;bottom:5vh;font-size:9px;font-weight:300;letter-spacing:.3em;color:var(--faint);pointer-events:none;z-index:5}

  /* 이어 붙인 장들 — 형식은 같고, 무엇이 올지는 모른다 */
  #chain{position:relative;width:var(--sw);margin:0 auto;padding-bottom:22vh;--sw:min(72vw,340px);
    transform-origin:50% 0;transition:transform 1.8s cubic-bezier(.45,0,.2,1)}
  #app{touch-action:pan-y}
  body.far #app{overflow:hidden}
  body.far #chain{transform:scale(var(--fs,1))}
  .sheet time{transition:opacity .8s}
  body.far .sheet time{opacity:0}
  #app{transition:opacity 1.6s ease 1s, filter .9s ease}
  body.solo #app{filter:blur(6px);opacity:.25;transition:opacity .9s ease, filter .9s ease}
  #solo{position:fixed;inset:0;z-index:15;display:flex;flex-direction:column;align-items:center;justify-content:center;
    opacity:0;pointer-events:none;transition:opacity .9s ease}
  body.solo #solo{opacity:1;pointer-events:auto}
  #solo img{width:min(86vw, calc((100svh - 120px) * .75));aspect-ratio:3/4;object-fit:cover;background:#f7f8f6;
    box-shadow:0 0 0 .5px rgba(68,71,76,.12), 0 2px 10px rgba(68,71,76,.06)}
  #solo time{margin-top:16px;font-size:9px;letter-spacing:.2em;color:var(--faint)}
  .sheet{position:relative;width:var(--sw);aspect-ratio:3/4;background:#f7f8f6;
    box-shadow:0 0 0 .5px rgba(68,71,76,.10), 0 1px 3px rgba(68,71,76,.04);
    opacity:0;transform:translateY(10px);transition:opacity 1.2s ease, transform 1.2s ease}
  .sheet.seen{opacity:1;transform:none}
  .sheet + .sheet{margin-top:-1px}
  .sheet img.pic{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .sheet img.strip{position:absolute;left:0;right:0;bottom:0;width:100%;height:12%;object-fit:cover;object-position:50% 100%}
  .sheet time{position:absolute;right:-4px;bottom:6px;transform:translateX(100%);padding-left:8px;
    font-size:8px;letter-spacing:.12em;color:var(--faint);writing-mode:vertical-rl;opacity:.8}
  /* 맨 끝 장은 얇은 천에 덮여 아래 가장자리 한 줄만 비친다 */
  .veil{position:absolute;left:-1px;right:-1px;top:-1px;bottom:12%;
    background:rgba(242,243,241,.9);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);
    transition:opacity 1.8s cubic-bezier(.4,0,.2,1), transform 2.2s cubic-bezier(.3,0,.2,1), filter 1.8s ease}
  .veil::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:6px;
    background:linear-gradient(rgba(242,243,241,.9),rgba(242,243,241,0))}
  .veil.lift{opacity:0;transform:translateY(-6%) scale(1.02);filter:blur(3px);pointer-events:none}
  svg.seams{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none}
  /* 다음 자리: 비어 있다 */
  .next{position:relative;width:var(--sw);aspect-ratio:3/4;margin-top:-1px;cursor:pointer}
  .next::before{content:"";position:absolute;inset:0;border:.5px dashed rgba(162,167,172,.55)}
  @keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}

  /* 한 장 놓기: 앞 장의 아래 한 줄만 보고 잇는다 */
  #compose{position:fixed;inset:0;z-index:20;background:var(--paper);display:flex;flex-direction:column;
    align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .8s ease;
    --pw:min(84vw, calc((100svh - 210px) * .75))}
  body.composing #compose{opacity:1;pointer-events:auto}
  .cstrip{display:block;width:var(--pw);aspect-ratio:750/120;object-fit:cover;opacity:.9}
  .cpaper{position:relative;width:var(--pw);aspect-ratio:3/4;background:#f7f8f6;
    box-shadow:0 0 0 .5px rgba(68,71,76,.14), 0 1px 3px rgba(68,71,76,.05)}
  .cstrip + .cpaper{border-top:.5px dashed rgba(40,62,104,.5)}
  .cphoto{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
  .cink{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
  .ctools{display:flex;gap:30px;margin-top:22px;font-size:12px;letter-spacing:.25em;color:var(--faint)}
  .ctools button,.ctools label{background:none;border:0;font:inherit;font-weight:300;color:inherit;letter-spacing:inherit;padding:6px 2px;cursor:pointer}
  .ctools .cplace{color:var(--ink)}
  .ctools input{display:none}
  .cnote{height:16px;margin-top:8px;font-size:11px;letter-spacing:.12em;color:var(--faint)}
  .cclose{position:absolute;top:calc(env(safe-area-inset-top) + 12px);right:14px;background:none;border:0;
    font:inherit;font-size:22px;font-weight:200;color:var(--faint);padding:8px;cursor:pointer}

  /* 잠금: 얇은 종이 한 장 */
  #lock{position:fixed;inset:0;background:var(--paper);
    transition:opacity 2.2s cubic-bezier(.4,0,.2,1) .3s, transform 2.6s cubic-bezier(.3,0,.2,1) .3s, filter 2.2s ease .3s}
  /* 종이 결: 고운 입자 + 가장자리가 아주 살짝 어두운 빛 */
  #lock::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.55;mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .42  0 0 0 0 .44  0 0 0 0 .47  0 0 0 .09 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");}
  #lock::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 90% at 50% 45%, rgba(255,255,255,.16) 0%, rgba(255,255,255,0) 70%, rgba(90,96,104,.05) 100%);}
  /* 열릴 때: 얇은 천이 비치며 걷힌다 */
  body.opened #lock{opacity:0;transform:translateY(-3%) scale(1.03);filter:blur(3px);pointer-events:none}

  canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;z-index:2}

  /* 종이에 눌려 남은 글씨 자국 */
  .trace{position:absolute;left:13vw;top:21vh;pointer-events:none;z-index:1;
    font-family:"Nanum Pen Script",cursive;font-size:17px;letter-spacing:.03em;
    color:rgba(58,62,70,.032);filter:blur(.3px);transform:rotate(-3deg)}

  .sig{position:absolute;left:0;right:0;top:61vh;text-align:center;pointer-events:none;line-height:1;z-index:1}
  /* 이름: n.n. — nomen nescio, 이름 모를 */
  .sig b{font-weight:200;font-size:30px;letter-spacing:.2em;padding-left:.2em;color:var(--ink)}
  /* 이름 아래 작은 풀이: 이름과 같은 폭으로 맞춰 놓는다 */
  .gloss{position:absolute;top:0;white-space:nowrap;font-size:10px;font-weight:300;color:var(--faint);
    pointer-events:none;z-index:1;opacity:0;transition:opacity 1.2s ease}
  .gloss.on{opacity:.9}
  .by{position:absolute;right:7vw;bottom:5vh;pointer-events:none;z-index:1;
    font-size:9px;font-weight:300;letter-spacing:.3em;color:var(--faint)}
</style>
</head>
<body>

<main id="app"><h1>n.n.</h1><div id="chain"></div><div class="by">tu.:na.</div></main>

<div id="compose">
  <button class="cclose" aria-label="닫기">×</button>
  <img class="cstrip" alt="">
  <div class="cpaper"><img class="cphoto" alt="" style="display:none"><canvas class="cink"></canvas></div>
  <div class="ctools">
    <label>사진<input type="file" accept="image/*"></label>
    <button class="cclear">지우기</button>
    <button class="cplace">놓기</button>
  </div>
  <div class="cnote"></div>
</div>

<div id="lock">
  <div class="trace">나의 오랜 친구에게</div>
  <div class="sig"><b><span class="g">n</span><span class="g">.</span><span class="g">n</span><span class="g" id="knot">.</span></b></div>
  <div class="gloss">비워 둔 이름</div>
  <div class="by">tu.:na.</div>
  <canvas id="pad"></canvas>
</div>

<script>
(() => {
  const cvs = document.getElementById('pad');
  const ctx = cvs.getContext('2d');
  const knotEl = document.getElementById('knot');
  const RED = [40,62,104];   // 쪽물 들인 깊은 남색 실
  const rgba = (a,c=RED) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

  let W=0,H=0,dpr=1, knot={x:0,y:0};
  let strokes=[], cur=null, timer=null, state='idle'; // idle | drawing | fail | open
  let failT=0, openT=0, grow=1, tug=0;
  let needlePos=null, drawn=0, poke=-9;           // 실 끝(바늘귀) 위치, 이어 그린 길이, 엉뚱한 곳을 건드린 때
  let under=[];                                    // 이름 글자들 아래로 지나는 실의 자리
  const NEED = () => Math.max(620, Math.min(W, 520) * 2.2);   // 끊기지 않고 이어야 하는 길이

  function resize(){
    dpr = Math.min(window.devicePixelRatio||1, 3);
    W = innerWidth; H = innerHeight;
    cvs.width = W*dpr; cvs.height = H*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    const r = knotEl.getBoundingClientRect();
    knot = {x:r.left + r.width*0.5, y:r.bottom - r.height*0.22};
    // n . n . — 떨어져 보이지만, 천 아래로 실 한 가닥이 글자의 발과 점을 지나 이어져 있다
    under = [];
    const gs = [...document.querySelectorAll('.sig .g')];
    gs.forEach((g,i)=>{
      const b = g.getBoundingClientRect(), y = b.bottom - b.height*0.22;
      if(g.textContent==='n'){ under.push({x:b.left+b.width*.2,y}); under.push({x:b.right-b.width*.2,y}); }
      else under.push({x:b.left+b.width*.5,y});
    });
    if(under.length) under.unshift({x:under[0].x-14,y:under[0].y+3});
    // 풀이 한 줄: 첫 n의 왼쪽 끝부터 마지막 점까지, 이름과 같은 폭으로 고르게 벌린다
    const gl = document.querySelector('.gloss');
    if(gl && gs.length){
      const L = gs[0].getBoundingClientRect().left, R = gs[gs.length-1].getBoundingClientRect();
      const right = R.left + R.width*.5 - 2, n = [...gl.textContent].length;
      gl.style.letterSpacing = '0px';
      const nat = gl.getBoundingClientRect().width;
      const ls = Math.max(0, (right - L - nat) / (n - 1));
      gl.style.letterSpacing = ls.toFixed(2)+'px';
      gl.style.left = L.toFixed(1)+'px';
      gl.style.top = (knot.y + 14).toFixed(1)+'px';
      gl.classList.add('on');
    }
  }
  function underThread(alpha){
    if(under.length<2) return;
    ctx.save(); ctx.filter='blur(.35px)';
    ctx.beginPath(); ctx.moveTo(under[0].x,under[0].y);
    for(let i=1;i<under.length;i++){
      const a=under[i-1], b=under[i];
      ctx.quadraticCurveTo((a.x+b.x)/2, Math.max(a.y,b.y)+5, b.x, b.y);   // 천 아래로 살짝 처지며
    }
    ctx.strokeStyle=rgba(.13*alpha); ctx.lineWidth=.8; ctx.lineCap='round'; ctx.stroke();
    ctx.restore();
  }
  addEventListener('resize', resize);
  document.fonts && document.fonts.ready.then(resize);

  /* ---------- 입력 ---------- */
  // 실 끝(바늘)을 잡아, 손을 떼지 않고 끊기지 않게 이어가면 열린다.
  cvs.addEventListener('pointerdown', e=>{
    if(state!=='idle') return;
    const near = needlePos && Math.hypot(e.clientX-needlePos.x, e.clientY-needlePos.y) < 54;
    if(!near){ poke = performance.now()/1000; return; }            // 다른 곳: 실이 바람결에 한 번 출렁일 뿐
    cvs.setPointerCapture(e.pointerId);
    cur=[{x:needlePos.x,y:needlePos.y},{x:e.clientX,y:e.clientY}]; strokes=[cur]; drawn=0; state='drawing';
    navigator.vibrate && navigator.vibrate(4);
  });
  cvs.addEventListener('pointermove', e=>{
    if(!cur || state!=='drawing') return;
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    for(const c of evs){
      const l=cur[cur.length-1], d=Math.hypot(c.clientX-l.x,c.clientY-l.y);
      if(d>1.5){ cur.push({x:c.clientX,y:c.clientY}); drawn+=d; }
    }
    if(drawn >= NEED()) open();
  });
  const end=()=>{ if(!cur || state!=='drawing') return; cur=null; state='fail'; failT=0;   // 손을 떼면 실이 끊긴다
    navigator.vibrate && navigator.vibrate([20,40,20]); };
  cvs.addEventListener('pointerup', end);
  cvs.addEventListener('pointercancel', end);
  function open(){
    cur=null; state='open'; openT=0;
    navigator.vibrate && navigator.vibrate(18);
    setTimeout(()=>{
      document.body.classList.add('opened');
      try{ sessionStorage.setItem('tuna-open','1'); }catch(e){}
    }, 900);
  }

  /* ---------- 그리기 ---------- */
  function spaced(pts, gap){
    const out=[pts[0]];
    for(let i=1;i<pts.length;i++){
      let a=out[out.length-1], b=pts[i], d=Math.hypot(b.x-a.x,b.y-a.y);
      while(d>=gap){ const k=gap/d; a={x:a.x+(b.x-a.x)*k,y:a.y+(b.y-a.y)*k}; out.push(a); d=Math.hypot(b.x-a.x,b.y-a.y); }
    }
    return out;
  }

  // 꼬임이 보이는 실 한 가닥 (경로 = 점 배열)
  function thread(pts, alpha=1, w=1.25){
    if(pts.length<2) return;
    ctx.lineCap='round'; ctx.lineJoin='round';
    const path=()=>{ ctx.beginPath(); pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)); };
    // 종이에 드리운 아주 옅은 그림자
    ctx.save(); ctx.translate(.7,1.1); path(); ctx.strokeStyle=`rgba(40,44,52,${.07*alpha})`; ctx.lineWidth=w+.8; ctx.stroke(); ctx.restore();
    // 몸통
    path(); ctx.strokeStyle=rgba(.88*alpha); ctx.lineWidth=w; ctx.stroke();
    // 꼬임: 짧게 끊긴 밝은 결과 어두운 결
    ctx.setLineDash([1.2,2.3]);
    path(); ctx.strokeStyle=`rgba(226,236,255,${.22*alpha})`; ctx.lineWidth=w*.45; ctx.stroke();
    ctx.lineDashOffset=1.7;
    path(); ctx.strokeStyle=`rgba(8,16,40,${.25*alpha})`; ctx.lineWidth=w*.4; ctx.stroke();
    ctx.setLineDash([]); ctx.lineDashOffset=0;
  }

  function quad(x1,y1,cx,cy,x2,y2,n=40){
    const out=[]; for(let i=0;i<=n;i++){const t=i/n,u=1-t;
      out.push({x:u*u*x1+2*u*t*cx+t*t*x2, y:u*u*y1+2*u*t*cy+t*t*y2});}
    return out;
  }

  // 바늘: 귀 쪽은 둥글고 끝은 뾰족, 은빛, 귀에 구멍 (eye=바늘귀 위치, ang=끝이 향하는 방향)
  function needle(ex,ey,ang,alpha=1){
    const L=30, Wd=1.7;
    ctx.save(); ctx.translate(ex,ey); ctx.rotate(ang); ctx.globalAlpha=alpha;
    // 그림자
    ctx.save(); ctx.translate(.8,1.4); ctx.beginPath();
    ctx.moveTo(-3,-Wd/2); ctx.lineTo(L,0); ctx.lineTo(-3,Wd/2); ctx.arc(-3,0,Wd/2,Math.PI/2,-Math.PI/2);
    ctx.fillStyle='rgba(40,44,52,.12)'; ctx.fill(); ctx.restore();
    // 몸통
    const g=ctx.createLinearGradient(0,-Wd/2,0,Wd/2);
    g.addColorStop(0,'#c9ced3'); g.addColorStop(.45,'#f4f6f7'); g.addColorStop(1,'#7f868d');
    ctx.beginPath(); ctx.moveTo(-3,-Wd/2); ctx.quadraticCurveTo(L*.6,-Wd*.45,L,0); ctx.quadraticCurveTo(L*.6,Wd*.45,-3,Wd/2);
    ctx.arc(-3,0,Wd/2,Math.PI/2,-Math.PI/2); ctx.closePath();
    ctx.fillStyle=g; ctx.fill();
    ctx.strokeStyle='rgba(90,96,104,.55)'; ctx.lineWidth=.35; ctx.stroke();
    // 바늘귀
    ctx.beginPath(); ctx.ellipse(0,0,2.2,.42,0,0,Math.PI*2); ctx.fillStyle='#e9ebea'; ctx.fill();
    ctx.restore();
  }

  // 바늘귀를 지나 반대편으로 살짝 나온 실 꼬리 (끝이 풀림)
  function tail(ex,ey,ang,alpha=1){
    const bx=Math.cos(ang+Math.PI), by=Math.sin(ang+Math.PI);
    const px=-by, py=bx;
    const a={x:ex,y:ey}, m={x:ex+bx*7+px*1.5,y:ey+by*7+py*1.5}, e={x:ex+bx*12+px*3.5,y:ey+by*12+py*3.5};
    thread([a,m,e],alpha*.9,1.1);
    ctx.lineWidth=.5; ctx.strokeStyle=rgba(.45*alpha);
    ctx.beginPath(); ctx.moveTo(e.x,e.y); ctx.lineTo(e.x+bx*3+px*1.8,e.y+by*3+py*1.8); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(e.x,e.y); ctx.lineTo(e.x+bx*3.4-px*.6,e.y+by*3.4-py*.6); ctx.stroke();
  }

  // 홈질 바늘땀
  function stitches(pts, opts={}){
    const {fall=0, taut=0} = opts;
    const s = spaced(pts, 5.5);
    if(taut>0) thread(s, taut, 1.4);
    for(let i=0;i+1<s.length;i+=2){
      const a=s[i], b=s[i+1];
      const seed=Math.sin(i*12.9898)*43758.5453, r=seed-Math.floor(seed);
      const dy = fall*fall*(60+r*140), dx = fall*(r-.5)*40, rot=fall*(r-.5)*2;
      const alpha = (1-fall)*(1-taut);
      if(alpha<=0.01) continue;
      const mx=(a.x+b.x)/2+dx, my=(a.y+b.y)/2+dy, hx=(b.x-a.x)/2, hy=(b.y-a.y)/2;
      const c=Math.cos(rot), sn=Math.sin(rot), ex=hx*c-hy*sn, ey=hx*sn+hy*c;
      thread([{x:mx-ex,y:my-ey},{x:mx+ex,y:my+ey}], alpha, 1.9);
      if(fall<.05){ // 바늘 구멍
        ctx.fillStyle=`rgba(60,64,72,${.22*alpha})`;
        ctx.beginPath(); ctx.arc(a.x-hx*.15,a.y-hy*.15,.65,0,7); ctx.fill();
        ctx.beginPath(); ctx.arc(b.x+hx*.15,b.y+hy*.15,.65,0,7); ctx.fill();
      }
    }
  }

  function frame(t){
    ctx.clearRect(0,0,W,H);
    const tt=t/1000;
    underThread(state==='open' ? 1-openT : 1);

    if(state==='fail'){
      failT=Math.min(1,failT+0.022);
      strokes.forEach(s=>s.length>1&&stitches(s,{fall:failT}));
      if(failT>=1){ strokes=[]; state='idle'; grow=0; }
    } else if(state==='open'){
      openT=Math.min(1,openT+0.025);
      strokes.forEach(s=>s.length>1&&stitches(s,{taut:openT}));
    } else {
      strokes.forEach(s=>s.length>1&&stitches(s));
    }

    const last = strokes.length ? strokes[strokes.length-1] : null;
    const tip = last ? last[last.length-1] : null;
    if(state==='drawing' && tip){
      // 서명에서 첫 바늘땀까지 느슨한 실
      const first = strokes[0][0];
      const d = Math.hypot(first.x-knot.x, first.y-knot.y);
      if(d>6){ const sag=Math.max(30,d*0.22);
        thread(quad(knot.x,knot.y,(knot.x+first.x)/2,Math.max(knot.y,first.y)+sag,first.x,first.y), .8, 1.15); }
      // 바늘은 손끝에
      const prev = last[Math.max(0,last.length-6)];
      const ang = Math.atan2(tip.y-prev.y,tip.x-prev.x);
      needle(tip.x-Math.cos(ang)*26, tip.y-Math.sin(ang)*26, ang, 1);
    } else if(state==='idle'){
      // 서명 끝에서 바람에 흔들리는 실
      grow=Math.min(1,grow+0.018);
      const e=1-(1-grow)**3;
      // 느긋한 흔들림 + 가끔 한 번씩 이는 바람
      const gust = Math.max(0, Math.sin(tt*0.9 - 1.2)) ** 6 * Math.sin(tt*5.2) * 7;
      const pk = Math.max(0, 1-(tt-poke)/1.6);                       // 건드리면 한 번 출렁
      const sway=Math.sin(tt*0.9)*20 + Math.sin(tt*2.1+1)*5 + gust + pk*pk*Math.sin((tt-poke)*7)*16;
      const len=150*e*(1+0.03*Math.sin(tt*0.6));
      const ex=knot.x+30*e+sway, ey=knot.y-len+Math.abs(sway)*.15;
      const cx=knot.x+38*e+sway*.45, cy=knot.y-len*.45;
      thread(quad(knot.x,knot.y,cx,cy,ex,ey), 1, 1.25);
      needlePos = {x:ex, y:ey};
      if(e>.3){
        const ang=Math.atan2(ey-cy,ex-cx);           // 실이 나아가는 방향
        const a=(e-.3)/.7;
        tail(ex,ey,ang,a);
        needle(ex,ey,ang+Math.PI*0.5*0+Math.sin(tt*1.3)*.05, a);
      }
    }
    requestAnimationFrame(frame);
  }

  window.__lock = { get state(){return state;}, get needle(){return needlePos;}, NEED };

  try{ if(sessionStorage.getItem('tuna-open')==='1') document.body.classList.add('opened'); }catch(e){}
  resize();
  requestAnimationFrame(frame);
})();
</script>
