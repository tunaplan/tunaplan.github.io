<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f7f5f0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>tu.:na.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@200;300&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
  :root{ --paper:#f7f5f0; --ink:#4a4744; --faint:#aaa59c; }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{height:100%;overflow:hidden;background:#ece9e2;
    font-family:"Noto Serif KR",serif;font-weight:200;color:var(--ink)}

  /* 앱 (종이 뒤) */
  #app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--paper)}
  #app h1{font-weight:200;font-size:24px;letter-spacing:.35em;opacity:0;transition:opacity 1.4s ease .9s}
  body.opened #app h1{opacity:1}

  /* 잠금: 얇은 천 같은 종이 한 장 */
  #lock{position:fixed;inset:0;background:var(--paper);transform-origin:50% 0%;
    transition:transform 1.8s cubic-bezier(.5,0,.2,1), opacity 1.6s ease .2s, filter 1.6s ease;
    will-change:transform}
  #lock::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.55;
    background-image:
      repeating-linear-gradient(0deg, rgba(110,100,90,.03) 0 1px, transparent 1px 3px),
      repeating-linear-gradient(90deg, rgba(110,100,90,.025) 0 1px, transparent 1px 3px);}
  body.opened #lock{transform:perspective(900px) rotateX(-58deg) translateY(-30%);opacity:0;filter:blur(1px);pointer-events:none}

  canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}

  .hint{position:absolute;left:0;right:0;text-align:center;pointer-events:none;
    font-family:"Nanum Pen Script",cursive;font-size:22px;color:#8a847c;opacity:.75;
    transform:rotate(-3deg);transition:opacity .8s ease}
  .hint.hide{opacity:0}
  .sig{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 9vh);
    text-align:center;pointer-events:none;line-height:1}
  .sig small{display:block;font-size:10px;letter-spacing:.45em;color:var(--faint);margin-bottom:12px;padding-left:.45em}
  .sig b{font-weight:300;font-size:17px;letter-spacing:.22em;color:var(--ink)}
</style>
</head>
<body>

<main id="app"><h1>tu.:na.</h1></main>

<div id="lock">
  <canvas id="pad"></canvas>
  <div class="hint" id="hint">이어 그려보세요</div>
  <div class="sig"><small>plan by</small><b>tu.:na<span id="knot">.</span></b></div>
</div>

<script>
(() => {
  const cvs = document.getElementById('pad');
  const ctx = cvs.getContext('2d');
  const knotEl = document.getElementById('knot');
  const RED = [168,38,52];
  const rgba = a => `rgba(${RED[0]},${RED[1]},${RED[2]},${a})`;

  let W=0,H=0,dpr=1, knot={x:0,y:0};
  const hintEl = document.getElementById('hint');
  let half=[], tipPt={x:0,y:0}, heartBox={w:0};
  // 반쪽 하트 = 나의 마음 (가운데 오목한 곳 → 왼쪽 봉우리 → 아래 끝)
  function makeHalf(){
    const sc=Math.min(W*0.72, 290)/32, cx=W/2, cy=H*0.42;
    half=[];
    for(let i=0;i<=60;i++){
      const t=2*Math.PI - i/60*Math.PI;
      const wob=Math.sin(i*0.9)*0.6+Math.sin(i*0.37)*0.9;   // 손으로 놓은 듯한 흔들림
      half.push({x:cx+sc*16*Math.sin(t)**3+wob*.6, y:cy-sc*(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))+wob*.4});
    }
    tipPt=half[half.length-1]; heartBox={w:sc*32};
    hintEl.style.top=(tipPt.y+108)+'px';
  }
  let strokes=[], cur=null, timer=null, state='idle'; // idle | drawing | fail | open
  let failT=0, openT=0, retract=1;

  function resize(){
    dpr = Math.min(window.devicePixelRatio||1, 3);
    W = innerWidth; H = innerHeight;
    cvs.width = W*dpr; cvs.height = H*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    const r = knotEl.getBoundingClientRect();
    knot = {x:r.left + r.width*0.55, y:r.bottom - 3};
    makeHalf();
  }
  addEventListener('resize', resize);
  document.fonts && document.fonts.ready.then(resize);

  /* ---------- 입력 ---------- */
  cvs.addEventListener('pointerdown', e=>{
    if(state==='fail'||state==='open') return;
    clearTimeout(timer);
    cvs.setPointerCapture(e.pointerId);
    cur=[{x:e.clientX,y:e.clientY}]; strokes.push(cur); state='drawing'; hintEl.classList.add('hide');
  });
  cvs.addEventListener('pointermove', e=>{
    if(!cur) return;
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    for(const c of evs){
      const l=cur[cur.length-1];
      if(Math.hypot(c.clientX-l.x,c.clientY-l.y)>1.5) cur.push({x:c.clientX,y:c.clientY});
    }
  });
  const end=()=>{ if(!cur) return; cur=null; timer=setTimeout(check, 700); };
  cvs.addEventListener('pointerup', end);
  cvs.addEventListener('pointercancel', end);

  /* ---------- 그리기 ---------- */
  // 경로를 일정 간격으로 나눔
  function spaced(pts, gap){
    const out=[pts[0]]; let acc=0;
    for(let i=1;i<pts.length;i++){
      let a=out[out.length-1], b=pts[i], d=Math.hypot(b.x-a.x,b.y-a.y);
      while(d>=gap){ const k=gap/d; a={x:a.x+(b.x-a.x)*k,y:a.y+(b.y-a.y)*k}; out.push(a); d=Math.hypot(b.x-a.x,b.y-a.y); }
    }
    return out;
  }

  function threadLine(x1,y1,cx,cy,x2,y2,a,w){
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.quadraticCurveTo(cx,cy,x2,y2);
    ctx.strokeStyle=rgba(a); ctx.lineWidth=w; ctx.stroke();
  }

  function needle(x,y,ang,alpha){
    ctx.save(); ctx.translate(x,y); ctx.rotate(ang); ctx.globalAlpha=alpha;
    ctx.strokeStyle='rgba(120,118,115,.9)'; ctx.lineWidth=1.1; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(-3,0); ctx.lineTo(24,0); ctx.stroke();      // 몸통
    ctx.beginPath(); ctx.ellipse(-0.5,0,2.4,1.1,0,0,Math.PI*2); ctx.lineWidth=.8; ctx.stroke(); // 바늘귀
    ctx.restore();
  }

  // 홈질 바늘땀
  function stitches(pts, opts={}){
    const {fall=0, taut=0} = opts;
    const s = spaced(pts, 5);
    ctx.lineCap='round';
    if(taut>0){ // 하나로 이어진 실
      ctx.beginPath(); s.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));
      ctx.strokeStyle=rgba(.9*taut); ctx.lineWidth=1.8; ctx.stroke();
    }
    for(let i=0;i+1<s.length;i+=2){
      const a=s[i], b=s[i+1];
      const seed=Math.sin(i*12.9898)*43758.5453, r=seed-Math.floor(seed);
      const dy = fall*fall*(60+r*140), dx = fall*(r-.5)*40, rot=fall*(r-.5)*2;
      const alpha = (1-fall)*(1-taut*0.6);
      if(alpha<=0.01) continue;
      const mx=(a.x+b.x)/2+dx, my=(a.y+b.y)/2+dy, hx=(b.x-a.x)/2, hy=(b.y-a.y)/2;
      const c=Math.cos(rot), sn=Math.sin(rot);
      const ex=hx*c-hy*sn, ey=hx*sn+hy*c;
      // 그림자 (천에 살짝 뜬 실)
      ctx.beginPath(); ctx.moveTo(mx-ex+.6,my-ey+.9); ctx.lineTo(mx+ex+.6,my+ey+.9);
      ctx.strokeStyle=`rgba(60,40,40,${.12*alpha})`; ctx.lineWidth=2.2; ctx.stroke();
      ctx.beginPath(); ctx.moveTo(mx-ex,my-ey); ctx.lineTo(mx+ex,my+ey);
      ctx.strokeStyle=rgba(.92*alpha); ctx.lineWidth=2; ctx.stroke();
      // 바늘 구멍
      if(fall<.05){
        ctx.fillStyle=`rgba(80,70,65,${.18*alpha})`;
        ctx.beginPath(); ctx.arc(a.x,a.y,.7,0,7); ctx.fill();
      }
    }
  }

  function frame(t){
    ctx.clearRect(0,0,W,H);
    const tt=t/1000;

    // 미리 놓인 반쪽
    stitches(half,{taut: state==='open'?openT:0});

    // 그린 바늘땀
    if(state==='fail'){
      failT=Math.min(1,failT+0.022);
      strokes.forEach(s=>s.length>1&&stitches(s,{fall:failT}));
      if(failT>=1){ strokes=[]; state='idle'; retract=0; hintEl.classList.remove('hide'); }
    } else if(state==='open'){
      openT=Math.min(1,openT+0.03);
      strokes.forEach(s=>s.length>1&&stitches(s,{taut:openT}));
    } else {
      strokes.forEach(s=>s.length>1&&stitches(s));
    }

    // 서명 끝에서 나온 실
    const last = strokes.length ? strokes[strokes.length-1] : null;
    const tip = last ? last[last.length-1] : null;
    if((state==='drawing') && tip){
      const first = strokes[0][0];
      // 서명에서 첫 바늘땀까지 느슨한 실
      const d = Math.hypot(first.x-tipPt.x, first.y-tipPt.y);
      if(d>6){ const sag=Math.max(20,d*0.3);
        threadLine(tipPt.x,tipPt.y,(tipPt.x+first.x)/2,Math.max(tipPt.y,first.y)+sag,first.x,first.y,.55,1.1); }
      // 바늘은 손끝에
      const prev = last[Math.max(0,last.length-6)];
      needle(tip.x,tip.y,Math.atan2(tip.y-prev.y,tip.x-prev.x),1);
    } else if(state==='idle'){
      // 반쪽 끝에 매달린 실 + 바늘
      retract=Math.min(1,retract+0.02);
      const e=1-(1-retract)**3;
      const sway=Math.sin(tt*1.1)*9 + Math.sin(tt*2.3)*3;
      const len=70*e;
      const ex=tipPt.x+18*e+sway, ey=tipPt.y+len;
      const cx=tipPt.x+4+sway*.3, cy=tipPt.y+len*.55;
      threadLine(tipPt.x,tipPt.y,cx,cy,ex,ey,.7,1.1);
      if(e>.3) needle(ex,ey,Math.atan2(ey-cy,ex-cx),(e-.3)/.7);
    }
    requestAnimationFrame(frame);
  }

  /* ---------- 하트 인식 ---------- */
  // 하트 템플릿 (화면 좌표, y 아래로)
  const TEMPLATE = normalize(Array.from({length:120},(_,i)=>{
    const t = i/120*Math.PI*2;
    return {x:16*Math.sin(t)**3, y:-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))};
  }));

  function resample(pts, n){
    let len=0; for(let i=1;i<pts.length;i++) len+=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y);
    if(len===0) return [];
    const step=len/(n-1), out=[pts[0]]; let acc=0, prev=pts[0];
    for(let i=1;i<pts.length;i++){
      let p=pts[i], d=Math.hypot(p.x-prev.x,p.y-prev.y);
      while(acc+d>=step && d>0){
        const k=(step-acc)/d, q={x:prev.x+k*(p.x-prev.x), y:prev.y+k*(p.y-prev.y)};
        out.push(q); prev=q; d=Math.hypot(p.x-prev.x,p.y-prev.y); acc=0;
      }
      acc+=d; prev=p;
    }
    return out;
  }
  function normalize(pts){
    let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
    for(const p of pts){x0=Math.min(x0,p.x);y0=Math.min(y0,p.y);x1=Math.max(x1,p.x);y1=Math.max(y1,p.y);}
    const w=(x1-x0)||1,h=(y1-y0)||1;
    return pts.map(p=>({x:(p.x-x0)/w,y:(p.y-y0)/h}));
  }
  const nearest=(p,set)=>{let m=Infinity;for(const q of set){const d=(p.x-q.x)**2+(p.y-q.y)**2;if(d<m)m=d;}return Math.sqrt(m);};

  function isHeart(strokes){
    let raw = strokes.flat();
    if(raw.length<10) return false;
    // 너무 작게 그린 건 무시
    const xs=raw.map(p=>p.x), ys=raw.map(p=>p.y);
    const w=Math.max(...xs)-Math.min(...xs), h=Math.max(...ys)-Math.min(...ys);
    if(w<60||h<60) return false;
    const ratio=w/h; if(ratio<0.4||ratio>2.6) return false;

    let pts=[]; for(const s of strokes){ if(s.length>1) pts.push(...resample(s, Math.max(8,Math.round(s.length)))); }
    pts = normalize(resample(pts.length?pts:raw, 128));

    // 1) 위쪽: 가운데가 양옆 볼록한 곳보다 들어가 있어야 함 (하트의 핵심)
    // 위쪽 윤곽선: x 구간별 가장 위 점
    const N=20, prof=Array(N).fill(0.65);
    for(const p of pts) if(p.y<0.65){const k=Math.min(N-1,Math.floor(p.x*N)); prof[k]=Math.min(prof[k],p.y);}
    let best=0;
    for(let i=0;i<N;i++) for(let j=i+4;j<N;j++){           // 두 봉우리 i, j
      let valley=0; for(let k=i+1;k<j;k++) valley=Math.max(valley,prof[k]);
      best=Math.max(best, valley-Math.max(prof[i],prof[j]));
    }
    if(best<0.06) return false;

    // 2) 전체: 대강 하트 느낌이면 통과 (아주 느슨하게)
    const a = pts.map(p=>nearest(p,TEMPLATE)).sort((x,y)=>x-y);
    const b = TEMPLATE.map(p=>nearest(p,pts)).sort((x,y)=>x-y);
    const mean = (a.reduce((s,v)=>s+v,0)/a.length + b.reduce((s,v)=>s+v,0)/b.length)/2;
    return mean<0.15 && a[a.length>>1]<0.09 && a[Math.floor(a.length*.85)]<0.3;
  }
  window.__isHeart = isHeart;


  // 오른쪽 반쪽 모양인지 (대강)
  const RIGHT = normalize(Array.from({length:60},(_,i)=>{const t=i/59*Math.PI;
    return {x:16*Math.sin(t)**3, y:-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))};}));
  function isRightHalf(st){
    let pts=[]; for(const s of st){ if(s.length>1) pts.push(...resample(s, Math.max(8,s.length))); }
    if(pts.length<8) return false;
    pts=normalize(resample(pts,96));
    const a=pts.map(p=>nearest(p,RIGHT)).sort((x,y)=>x-y);
    const b=RIGHT.map(p=>nearest(p,pts)).sort((x,y)=>x-y);
    const mean=(a.reduce((s,v)=>s+v,0)/a.length+b.reduce((s,v)=>s+v,0)/b.length)/2;
    return mean<0.11 && b[Math.floor(b.length*.95)]<0.18 && a[Math.floor(a.length*.85)]<0.2;
  }

  // 나의 마음(반쪽) + 이어 그린 마음 = 사랑
  function isLove(){
    const pts=strokes.flat(); if(pts.length<8) return false;
    const xs=pts.map(p=>p.x), ys=pts.map(p=>p.y);
    const w=Math.max(...xs)-Math.min(...xs), h=Math.max(...ys)-Math.min(...ys);
    const meanX=xs.reduce((a,b)=>a+b,0)/xs.length;
    // 오른쪽에 반쪽만큼은 그렸을 때만 합쳐서 봄
    if(meanX>W/2-heartBox.w*0.05 && w>heartBox.w*0.22 && h>heartBox.w*0.35 && isRightHalf(strokes)) return true;
    return isHeart(strokes);   // 따로 하트 하나를 통째로 그려도 열림
  }

  window.__love=st=>{strokes=st;const r=isLove();strokes=[];return r;};

  function check(){
    if(!strokes.length) return;
    if(isLove()){
      state='open'; openT=0;
      navigator.vibrate && navigator.vibrate(18);
      setTimeout(()=>{
        document.body.classList.add('opened');
        try{ sessionStorage.setItem('tuna-open','1'); }catch(e){}
      }, 700);
    } else {
      state='fail'; failT=0;
      navigator.vibrate && navigator.vibrate([25,40,25]);
    }
  }

  try{ if(sessionStorage.getItem('tuna-open')==='1') document.body.classList.add('opened'); }catch(e){}
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
